<script>
document.addEventListener("DOMContentLoaded", function () {

    const canvas = document.getElementById("myChart");

    if (!canvas) return;

    const ctx = canvas.getContext("2d");

    new Chart(ctx, {
        type: "doughnut",
        data: {
            labels: ["Online", "Offline"],
            datasets: [{
                data: [
                    Number("{{ online_count }}"),
                    Number("{{ offline_count }}")
                ],
                backgroundColor: [
                    "#22C55E",
                    "#EF4444"
                ],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "70%",
            plugins: {
                legend: {
                    position: "bottom",
                    labels: {
                        color: "white"
                    }
                }
            }
        }
    });

});
</script>
