<!DOCTYPE html>
<html>

<head>

<title>Add Device</title>

<link rel="stylesheet"
href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<div class="sidebar">

<h2>🛡 SecureIoT</h2>

<p>Security Operations Center</p>

<hr>

<a href="/dashboard">🏠 Dashboard</a>

<a href="/devices">📡 Devices</a>

<a href="/add_device">➕ Add Device</a>

<a href="/security_logs">📄 Security Logs</a>

<a href="/threat_detection">⚠ Threat Detection</a>

<br><br>

<a href="/logout" class="btn">Logout</a>

</div>

<!-- Main -->

<div class="main">

<h1>Add New IoT Device</h1>

<p style="color:#9CA3AF;">
Register a new device into the SecureIoT network.
</p>

<br>

<div class="card" style="max-width:700px;">

<form method="POST">

<label>📡 Device Name</label>

<input
type="text"
name="device_name"
placeholder="Enter Device Name"
required>

<label>🖥 Device Type</label>

<input
type="text"
name="device_type"
placeholder="Camera / Sensor / Smart Lock"
required>

<label>🌐 IP Address</label>

<input
type="text"
name="ip_address"
placeholder="192.168.1.10"
required>

<label>📶 Status</label>

<select name="status">

<option value="Active">

🟢 Active

</option>

<option value="Offline">

🔴 Offline

</option>

</select>

<br>

<button
class="btn"
type="submit">

➕ Add Device

</button>

<a
href="/devices"
class="btn"
style="background:#374151;">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
