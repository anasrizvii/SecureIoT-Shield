<!DOCTYPE html>
<html>

<head>

    <title>Login | SecureIoT Shield</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

🛡 SecureIoT Shield

</div>

<div class="container">

<div class="card" style="max-width:550px;margin:auto;">

<h2 style="text-align:center;">User Login</h2>

<p style="text-align:center;color:#9CA3AF;">
Access the Security Operations Center
</p>

{% with messages = get_flashed_messages() %}
{% if messages %}

{% for msg in messages %}

<div style="background:#111827;border-left:5px solid red;padding:10px;margin-bottom:15px;">

{{ msg }}

</div>

{% endfor %}

{% endif %}
{% endwith %}

<form method="POST">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter Email"
required>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<br>

<button class="btn" style="width:100%;" type="submit">

🔐 Login

</button>

</form>

<hr>

<div style="text-align:center;">

<p>

Don't have an account?

</p>

<a href="/register" class="btn">

Create Account

</a>

<br><br>

<a href="/">

⬅ Back to Home

</a>

</div>

</div>

</div>

<div class="footer">

<hr>

SecureIoT Shield © 2025

</div>

</body>

</html>
